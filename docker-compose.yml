name: who_backend
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${WHO_POSTGRES_DB:?Set WHO_POSTGRES_DB in .env}
      POSTGRES_USER: ${WHO_POSTGRES_USER:?Set WHO_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${WHO_POSTGRES_PASSWORD:?Set WHO_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${WHO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - who_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${WHO_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${WHO_MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  who_postgres_data:
    name: who_postgres_data
